services:
  backend:
    build: ./backend
    volumes:
      - app-data:/data
    environment:
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"

volumes:
  app-data:
